name: Deploy

# 手动触发：推 main 或打 tag 后，也可以手动点 Run workflow。
# 需要先在仓库 Settings → Secrets 配置：
#   CLOUDFLARE_API_TOKEN      # Pages 编辑权限的 API Token
#   CLOUDFLARE_ACCOUNT_ID     # 你的 Cloudflare 账号 ID
#   CLOUDFLARE_PROJECT_NAME   # Pages 项目名，默认 whitespace
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 没配 secret 时跳过（不会报红），配了才真正部署
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name ${{ secrets.CLOUDFLARE_PROJECT_NAME || 'whitespace' }}
